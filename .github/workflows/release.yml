name: CI

on:
  push:
    branches: [main, release/*]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, release/*]

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  release:
    name: Release
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build darwin universal binary
        run: make build-darwin-universal

      - name: Sign darwin binary
        run: |
          make sign-darwin

      - name: Build .mcpb bundle
        run: make build-mcpb-only

      - name: Build linux binaries
        run: |
          make build-linux-amd64
          make build-linux-arm64

      - name: Build windows binaries
        run: |
          make build-windows-amd64
          make build-windows-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/peek-mcp-windows-amd64.exe
            dist/peek-mcp-windows-arm64.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/peek-mcp.mcpb
            dist/peek-mcp
            dist/peek-mcp-linux-amd64
            dist/peek-mcp-linux-arm64
            dist/peek-mcp-windows-amd64.exe
            dist/peek-mcp-windows-arm64.exe
          generate_release_notes: true

  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          iscc /DAppVersion=$version installer\windows\peek-mcp.iss

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/peek-mcp-setup.exe
