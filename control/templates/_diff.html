<div hx-get="/fragments/sessions/{{.Id}}/{{.Kind}}" hx-trigger="click from:find button.refresh" hx-swap="outerHTML">
<div class="description">
  <button class="refresh" title="recompute the diff">Refresh</button>
  {{if .Target}}vs {{.Target}}{{end}}
  {{if .Truncated}}<span class="badge badge-dim">truncated at 256 KB</span>{{end}}
</div>
{{if .Empty}}
<div class="empty">No diff.</div>
{{else}}
<pre class="file-view">{{.Diff}}</pre>
{{end}}
</div>
