<div hx-get="/fragments/sessions/{{.Id}}/plan" hx-trigger="peek-refresh from:body throttle:1s" hx-swap="outerHTML">
{{if .Empty}}
<div class="empty">No plan.</div>
{{else}}
<div class="fragment-controls">
  <button class="icon" data-copy-target="#plan-raw" title="copy plan markdown">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
  </button>
</div>
<template id="plan-raw">{{.PlanRaw}}</template>
<div class="md-body">{{.PlanHTML}}</div>
{{end}}
</div>
