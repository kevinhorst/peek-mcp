<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peek logo</title>
<style>
  body { margin: 0; padding: 32px 16px; font: 13px/1.5 Helvetica Neue, Helvetica, Arial, sans-serif; color: #555; background: #fff; }
  h1 { font-size: 13px; font-weight: 400; margin: 0 0 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; max-width: 760px; }
  .cell { border: 1px solid #e5e5e5; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 120px; }
  .cell.dark { background: #111; border-color: #111; }
  .label { grid-column: 1 / -1; margin: 8px 0 -8px; }
  svg { max-width: 100%; height: auto; }
  .small svg { height: 24px; width: auto; }
  .small .cell { min-height: 64px; }
  .light { fill: #111; } .light-stroke { stroke: #111; }
  .dark .light { fill: #f4f4f4; } .dark .light-stroke { stroke: #f4f4f4; }
  text { font-family: Helvetica Neue, Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 400; letter-spacing: -1px; }
</style>
</head>
<body>
<h1>peek. — wordmark, mark, lockup</h1>

<div class="row">
  <div class="label">Wordmark</div>
  <div class="cell">
    <svg width="240" height="80" viewBox="0 0 240 80"><text class="light" x="16" y="56">peek</text><circle class="light" cx="127" cy="52" r="4.5"/></svg>
  </div>
  <div class="cell dark">
    <svg width="240" height="80" viewBox="0 0 240 80"><text class="light" x="16" y="56">peek</text><circle class="light" cx="127" cy="52" r="4.5"/></svg>
  </div>
</div>

<div class="row">
  <div class="label">Mark</div>
  <div class="cell">
    <svg width="64" height="64" viewBox="0 0 64 64"><path class="light-stroke" d="M6 32 C14 18 50 18 58 32 C50 46 14 46 6 32 Z" fill="none" stroke-width="3" stroke-linejoin="round"/><circle class="light" cx="32" cy="32" r="7"/></svg>
  </div>
  <div class="cell dark">
    <svg width="64" height="64" viewBox="0 0 64 64"><path class="light-stroke" d="M6 32 C14 18 50 18 58 32 C50 46 14 46 6 32 Z" fill="none" stroke-width="3" stroke-linejoin="round"/><circle class="light" cx="32" cy="32" r="7"/></svg>
  </div>
</div>

<div class="row">
  <div class="label">Lockup</div>
  <div class="cell">
    <svg width="320" height="80" viewBox="0 0 320 80"><g transform="translate(16 16)"><path class="light-stroke" d="M4 24 C10 13 38 13 44 24 C38 35 10 35 4 24 Z" fill="none" stroke-width="2.5" stroke-linejoin="round"/><circle class="light" cx="24" cy="24" r="5.5"/></g><text class="light" x="80" y="56">peek</text><circle class="light" cx="191" cy="52" r="4.5"/></svg>
  </div>
  <div class="cell dark">
    <svg width="320" height="80" viewBox="0 0 320 80"><g transform="translate(16 16)"><path class="light-stroke" d="M4 24 C10 13 38 13 44 24 C38 35 10 35 4 24 Z" fill="none" stroke-width="2.5" stroke-linejoin="round"/><circle class="light" cx="24" cy="24" r="5.5"/></g><text class="light" x="80" y="56">peek</text><circle class="light" cx="191" cy="52" r="4.5"/></svg>
  </div>
</div>

<div class="row small">
  <div class="label">At 24px</div>
  <div class="cell">
    <svg width="320" height="80" viewBox="0 0 320 80"><g transform="translate(16 16)"><path class="light-stroke" d="M4 24 C10 13 38 13 44 24 C38 35 10 35 4 24 Z" fill="none" stroke-width="2.5" stroke-linejoin="round"/><circle class="light" cx="24" cy="24" r="5.5"/></g><text class="light" x="80" y="56">peek</text><circle class="light" cx="191" cy="52" r="4.5"/></svg>
  </div>
  <div class="cell dark">
    <svg width="320" height="80" viewBox="0 0 320 80"><g transform="translate(16 16)"><path class="light-stroke" d="M4 24 C10 13 38 13 44 24 C38 35 10 35 4 24 Z" fill="none" stroke-width="2.5" stroke-linejoin="round"/><circle class="light" cx="24" cy="24" r="5.5"/></g><text class="light" x="80" y="56">peek</text><circle class="light" cx="191" cy="52" r="4.5"/></svg>
  </div>
</div>
</body>
</html>
