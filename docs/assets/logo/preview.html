<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peek logo</title>
<style>
  body { margin: 0; padding: 32px 16px; font: 13px/1.5 Helvetica Neue, Helvetica, Arial, sans-serif; color: #888; background: #000; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 760px; }
  .cell { border: 1px solid #222; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 120px; }
  .label { grid-column: 1 / -1; margin: 8px 0 -8px; }
  svg { max-width: 100%; height: auto; }
  .small svg { height: 24px; width: auto; }
  .small .cell { min-height: 64px; }
  text { font-family: Helvetica Neue, Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 400; letter-spacing: -1px; fill: #f4f4f4; }
</style>
</head>
<body>
<div class="row">
  <div class="label">Wordmark</div>
  <div class="cell">
    <svg width="160" height="80" viewBox="0 0 160 80"><text x="16" y="56">/</text><text x="27.5" y="56">peek</text><circle cx="139" cy="49" r="7" fill="#00ebaa"/></svg>
  </div>
  <div class="cell small">
    <svg width="160" height="80" viewBox="0 0 160 80"><text x="16" y="56">/</text><text x="27.5" y="56">peek</text><circle cx="139" cy="49" r="7" fill="#00ebaa"/></svg>
  </div>
  <div class="label">Mark (icon use only)</div>
  <div class="cell">
    <svg width="64" height="64" viewBox="0 0 64 64"><path d="M6 32 C14 18 50 18 58 32 C50 46 14 46 6 32 Z" fill="none" stroke="#f4f4f4" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="32" r="7" fill="#f4f4f4"/></svg>
  </div>
  <div class="cell small">
    <svg width="64" height="64" viewBox="0 0 64 64"><path d="M6 32 C14 18 50 18 58 32 C50 46 14 46 6 32 Z" fill="none" stroke="#f4f4f4" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="32" r="7" fill="#f4f4f4"/></svg>
  </div>
</div>
</body>
</html>
